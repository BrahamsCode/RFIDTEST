# =============================================================================
#  TRAZA — Producción (servidor central)
#  Uso:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
#  El borde (traza-edge) NO va aquí: se despliega por separado en cada tienda
#  con infra/docker-compose.edge.yml.
# =============================================================================

name: traza

x-api-base: &api-base
  image: ${REGISTRY}/traza-api:${TAG:-latest}
  env_file: [.env.prod]
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
  depends_on:
    postgres: { condition: service_healthy }
    redis:    { condition: service_healthy }
  restart: always
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:

  postgres:
    image: postgres:16
    env_file: [.env.prod]
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=300
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1          # SSD
      - -c
      - log_min_duration_statement=1000
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits: { memory: 8G }

  redis:
    image: redis:7-alpine
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 2gb --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      # Se genera con `mosquitto_passwd`; nunca se versiona.
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "8883:8883"        # MQTT sobre TLS únicamente
    restart: always

  api:
    <<: *api-base
    command: php-fpm
    expose: ["9000"]

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/traza.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - web-dist:/var/www/html/public:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on: [api]
    restart: always

  horizon:
    <<: *api-base
    command: php artisan horizon
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { memory: 2G }

  scheduler:
    <<: *api-base
    command: php artisan schedule:work

  reverb:
    <<: *api-base
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    expose: ["8080"]

  portal-listener:
    <<: *api-base
    command: php artisan traza:listen-portal
    # Este proceso es el camino crítico de la alarma antihurto.
    # Si muere, las alarmas dejan de funcionar sin que nadie se entere:
    # por eso tiene su propio healthcheck y alerta dedicada.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/portal-listener.alive && find /tmp/portal-listener.alive -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 2

  # ---------------------------------------------------------------------------
  # Observabilidad
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    restart: always

  grafana:
    image: grafana/grafana:latest
    env_file: [.env.prod]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    expose: ["3000"]
    restart: always

  loki:
    image: grafana/loki:latest
    volumes:
      - loki-data:/loki
    restart: always

  minio:
    image: minio/minio:latest
    env_file: [.env.prod]
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: always

  # ---------------------------------------------------------------------------
  # Copias de seguridad
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:16
    env_file: [.env.prod]
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/bash", "/backup.sh"]
    depends_on: [postgres]
    restart: always

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  prometheus-data:
  grafana-data:
  loki-data:
  minio-data:
  web-dist:
