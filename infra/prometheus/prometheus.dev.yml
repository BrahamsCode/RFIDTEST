# Recolección en desarrollo. El fichero de producción apunta a un borde por
# tienda (`edge-lim01`, `edge-lim02`…); aquí solo existe el contenedor `edge`
# del compose, y dejar los tres objetivos de producción haría que
# `BordeSinResponder` estuviera disparada de forma permanente.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    sistema: traza
    entorno: desarrollo

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: traza-edge
    metrics_path: /metrics
    static_configs:
      - targets: ['edge:9100']
        labels: { tienda: LIM-01 }
