# Alertas de infraestructura. Las de negocio (merma, exactitud) viven en la
# aplicación: aquí solo lo que indica que el sistema técnico está roto.
#
# Cada regla lleva su `for`, y no es un detalle: sin él, un corte de red de
# treinta segundos despierta a alguien de madrugada para nada, y a la tercera
# vez se silencian todas.

groups:
  - name: traza-edge
    rules:
      - alert: BordeSinResponder
        expr: up{job="traza-edge"} == 0
        for: 5m
        labels: { severity: critica }
        annotations:
          summary: 'El borde de {{ $labels.tienda }} lleva 5 min sin responder'
          description: >
            Sin borde no hay captura de lecturas. El buffer local sigue
            guardando si el proceso vive y solo cayó la red, pero si el equipo
            está apagado se pierde todo lo que pase mientras tanto.

      - alert: LectorDesconectado
        expr: traza_edge_reader_connected == 0
        for: 10m
        labels: { severity: critica }
        annotations:
          summary: 'Lector {{ $labels.reader }} desconectado en {{ $labels.tienda }}'

      - alert: BufferCreciendo
        expr: traza_edge_buffer_depth > 50000
        for: 30m
        labels: { severity: alta }
        annotations:
          summary: 'El buffer de {{ $labels.tienda }} no baja'
          description: >
            Media hora por encima de 50 000 lecturas pendientes significa que
            el vaciado no da abasto o el API rechaza los lotes. El límite del
            buffer son 2 000 000 de filas; al llegar empieza a descartar las
            más antiguas.

      - alert: VaciadoLento
        expr: >
          histogram_quantile(0.95,
            rate(traza_edge_flush_duration_seconds_bucket[15m])) > 10
        for: 15m
        labels: { severity: media }
        annotations:
          summary: 'El vaciado de {{ $labels.tienda }} tarda más de 10 s en el p95'

      # La métrica más útil del sistema, según `docs/07` §9. Si sube de
      # golpe, o el vecino instaló RFID, o entró mercadería sin tarar. Las dos
      # cosas hay que saberlas el mismo día.
      # `ignoring(stage)` no es opcional: los dos lados llevan una etiqueta
      # `stage` distinta, y sin ignorarla Prometheus no empareja nada y la
      # regla no dispara jamás. Se descubrió provocándola.
      - alert: SubidaDeEpcAjenos
        expr: >
          rate(traza_edge_reads_dropped_total{stage="epc_mask"}[15m])
            > ignoring(stage) 3 * rate(traza_edge_reads_total{stage="passed"}[15m])
        for: 20m
        labels: { severity: media }
        annotations:
          summary: 'En {{ $labels.tienda }} se descartan más EPC ajenos que propios'

      # Mismo caso que arriba con la etiqueta `direction`.
      - alert: PortalSinClasificar
        expr: >
          rate(traza_edge_portal_events_total{direction="indeterminado"}[1h])
            > ignoring(direction) rate(traza_edge_portal_events_total{direction="salida"}[1h])
        for: 1h
        labels: { severity: media }
        annotations:
          summary: 'El portal de {{ $labels.tienda }} no logra clasificar los cruces'
          description: >
            Más tránsitos indeterminados que salidas durante una hora: las
            antenas están mal colocadas o el umbral de confianza es demasiado
            alto para la geometría real de la puerta.

  - name: traza-respaldos
    rules:
      # `scripts/backup.sh` escribe estas series en un fichero que recoge el
      # node_exporter en modo textfile. Un respaldo que deja de ejecutarse en
      # silencio es lo habitual, y solo se descubre el día que hace falta.
      - alert: RespaldoAtrasado
        expr: time() - traza_backup_last_success_timestamp > 172800
        for: 1h
        labels: { severity: critica }
        annotations:
          summary: 'Hace más de 48 h que no hay un respaldo verificado'
          description: >
            La ventana normal es diaria. Dos días sin respaldo correcto
            significa que el trabajo falla o el contenedor no arranca.

      - alert: RespaldoSospechosamentePequeno
        expr: >
          traza_backup_last_size_bytes
            < 0.5 * avg_over_time(traza_backup_last_size_bytes[7d])
        for: 1h
        labels: { severity: alta }
        annotations:
          summary: 'El último respaldo pesa la mitad que la media de la semana'
          description: >
            Un volcado que encoge de golpe suele ser un `pg_dump` que se cortó
            a mitad. Pasa la verificación de `pg_restore --list` igual.

  - name: traza-api
    rules:
      # El suscriptor de portal caído deja la tienda sin antihurto, y nadie
      # lo nota hasta que roban algo. Es la alerta más importante del grupo.
      - alert: EscuchaPortalCaido
        expr: traza_portal_listener_alive == 0
        for: 2m
        labels: { severity: critica }
        annotations:
          summary: 'El suscriptor de portal no da señales de vida'
          runbook: 'docs/11-infraestructura-docker.md#9-manual-de-incidencias'

      # Cualquier valor distinto de cero significa que hay un camino de código
      # que muta `tags` sin pasar por StockMovementService. No lleva `for`:
      # esto no se espera a ver si se arregla solo.
      - alert: DiscrepanciaProyeccionMovimientos
        expr: traza_stock_projection_mismatch > 0
        labels: { severity: critica }
        annotations:
          summary: 'El stock proyectado no coincide con los movimientos ({{ $value }} unidades)'
          runbook: 'docs/05-modelo-de-datos.md#6-control-de-integridad-nocturno'

      - alert: ParticionDefaultConDatos
        expr: traza_tag_reads_default_rows > 0
        for: 1h
        labels: { severity: alta }
        annotations:
          summary: 'Hay filas en tag_reads_default: la rotación de particiones falló'
          description: >
            Esas lecturas no se pierden, pero quedan fuera del esquema de
            retención: la purga no las va a tocar nunca.

      - alert: ColaDeLecturasAtascada
        expr: traza_queue_depth{queue="reads"} > 5000
        for: 5m
        labels: { severity: alta }
        annotations:
          summary: 'La cola de lecturas acumula {{ $value }} trabajos'
