# Recolección de métricas de TRAZA. Ver `docs/07-middleware-rfid.md` §9.
#
# El intervalo de 30 s no es el de 15 s por defecto: las métricas que
# interesan aquí cambian en minutos, no en segundos, y los bordes son
# mini-PC con una conexión de galería que no conviene sondear de más.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    sistema: traza

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Bordes de tienda. Una entrada por tienda: son pocas y explícitas es más
  # legible que un descubrimiento automático que nadie va a mantener.
  - job_name: traza-edge
    metrics_path: /metrics
    static_configs:
      - targets: ['edge-lim01:9100']
        labels: { tienda: LIM-01 }
      - targets: ['edge-lim02:9100']
        labels: { tienda: LIM-02 }
      - targets: ['edge-cen01:9100']
        labels: { tienda: CEN-01 }

  - job_name: traza-api
    metrics_path: /api/v1/health
    static_configs:
      - targets: ['api:8000']
