# =============================================================================
#  TRAZA — Mosquitto (desarrollo)
#  En producción: TLS en 8883, autenticación y ACL por tienda (docs/12 §5).
# =============================================================================

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Solo desarrollo. Producción exige usuario/contraseña y ACL.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Los eventos de portal son pequeños y frecuentes; el mensaje nunca debería
# acercarse a este límite.
message_size_limit 65536
