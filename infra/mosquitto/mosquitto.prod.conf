# =============================================================================
#  TRAZA — Mosquitto (producción)
#  Solo TLS, solo usuarios autenticados, ACL por tienda.
#  Ver docs/12 §8, sección Infraestructura.
# =============================================================================

# Sin listener en 1883: en producción no se acepta MQTT en claro. Un evento de
# portal en claro permitiría a cualquiera en la red inyectar alarmas falsas o
# leer el movimiento de mercadería.
listener 8883
protocol mqtt

cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

tls_version tlsv1.3
require_certificate false

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Los eventos de portal son pequeños y frecuentes; el mensaje nunca debería
# acercarse a este límite.
message_size_limit 65536

# Un borde desconectado no debe acumular mensajes indefinidamente en el
# broker: cuando vuelva, sus lecturas van por el buffer SQLite, no por aquí.
max_queued_messages 1000
